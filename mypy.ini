[mypy]
python_version = 3.13
strict = True
warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
pretty = True

# Third-party libs without full stubs
[mypy-scapy.*]
ignore_missing_imports = True

[mypy-rich.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sounddevice.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-rtlsdr.*]
ignore_missing_imports = True

[mypy-pyModeS.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-folium.*]
ignore_missing_imports = True

[mypy-geopy.*]
ignore_missing_imports = True

[mypy-piexif.*]
ignore_missing_imports = True

# Relax strictness on legacy/generated files
[mypy-plugins.*]
ignore_errors = True

[mypy-tools.*]
ignore_errors = True
